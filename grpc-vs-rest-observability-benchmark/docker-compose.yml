version: '3.8'

services:
  service-a:
    build:
      context: ./service-a
    container_name: service-a
    ports:
      - "8081:8081"
      - "9091:9091"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    environment:
      - OTEL_SERVICE_NAME=service-a
      - OTEL_TRACES_EXPORTER=none
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none

  aggregator-service:
    build:
      context: ./aggregator-service
    container_name: aggregator-service
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
    depends_on:
      - service-a
    environment:
      - OTEL_SERVICE_NAME=aggregator-service
      - OTEL_TRACES_EXPORTER=none
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none