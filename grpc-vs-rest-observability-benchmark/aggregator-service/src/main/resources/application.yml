server:
  port: 8080

spring:
  grpc:
    client:
      channel:
        servicea:
          target: "service-a:9091" # either using dns prefix or not, both are valid
        serviceb:
          target: "dns:///service-b:9092"

management:
  tracing:
    sampling:
      probability: 1.0 # Sample 100% of requests for benchmarking

  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics,traces

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

serviceA:
  uri: 'http://service-a:8081/api/v1/data/'

serviceB:
  uri: 'http://service-b:8082/api/v1/data/'