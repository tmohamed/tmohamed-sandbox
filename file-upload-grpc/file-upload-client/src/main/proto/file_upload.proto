syntax = "proto3";

package com.mohamed.tamer.fileupload;

option java_multiple_files = true;
option java_package = "com.mohamed.tamer.fileupload.grpc";

service FileUploadService {
  // Client streaming: Client sends multiple chunks, server returns one response
  rpc UploadFile (stream FileUploadRequest) returns (FileUploadResponse);
}

message Metadata {
  string file_name = 1;
  string content_type = 2;
}

message FileUploadRequest {
  oneof payload {
    Metadata metadata = 1;
    bytes chunk = 2;
  }
}

message FileUploadResponse {
  string file_name = 1;
  int64 total_bytes = 2;
  string status = 3;
}