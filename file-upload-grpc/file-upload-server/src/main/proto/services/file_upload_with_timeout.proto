syntax = "proto3";

package com.mohamed.tamer.fileupload;

option java_multiple_files = true;
option java_package = "com.mohamed.tamer.file_upload_with_timeout";

service FileUploadWithTimeoutService {
  // Client streaming: Client sends multiple chunks, server returns one response
  rpc UploadFileWithTimeout (stream FileUploadWithTimeoutRequest) returns (FileUploadWithTimeoutResponse);
}

message Metadata2 {
  string file_name = 1;
  string content_type = 2;
}

message FileUploadWithTimeoutRequest {
  oneof payload {
    Metadata2 metadata = 1;
    bytes chunk = 2;
  }
}

message FileUploadWithTimeoutResponse {
  string file_name = 1;
  int64 total_bytes = 2;
  string status = 3;
}