syntax = "proto3";

package com.mohamed.tamer.hello;

option java_multiple_files = true;
option java_package = "com.mohamed.tamer.hello.grpc";

service HelloService {
  rpc SayHello (HelloRequest) returns (HelloReply);
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}