apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
spec:
  replicas: 3
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
    spec:
      containers:
        - name: service-a
          image: service-a:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 9091
---
apiVersion: v1
kind: Service
metadata:
  name: service-a-headless
spec:
  clusterIP: None
  selector:
    app: service-a
  ports:
    - port: 9091
      targetPort: 9091